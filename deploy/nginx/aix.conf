# Invoice Intelligence Engine (OCI production) - aix.handsoffretail.com
# Installed as /etc/nginx/sites-available/aix (+ symlink in sites-enabled). Proxies to the production app
# container on 127.0.0.1:8100 (/opt/edihor/production). Separate from the other project's sites ("hor" =
# mystores, "chats"), which are never edited. Change procedure: docs/oci-vm-runbook.md, section 10.
# The certificate is Let's Encrypt (certbot, nginx authenticator, auto-renewed); certbot does not edit this file.

server {
    listen 80;
    listen [::]:80;
    server_name aix.handsoffretail.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aix.handsoffretail.com;

    ssl_certificate /etc/letsencrypt/live/aix.handsoffretail.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aix.handsoffretail.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Invoice uploads: the app accepts files up to 25 MB.
    client_max_body_size 30m;

    # OCR + AI extraction of one invoice can take up to a minute.
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    send_timeout 180s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # The app signs users in with its own cookie and never reads an Authorization header; none is passed on.
    proxy_set_header Authorization "";

    location / {
        proxy_pass http://127.0.0.1:8100;
    }
}
